services:
  - type: web
    name: agrisense-inference
    runtime: python
    plan: starter
    buildCommand: pip install -r pipeline/requirements_inference.txt
    startCommand: uvicorn pipeline.inference_service:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AGRISENSE_MODEL_DIR
        value: /opt/render/project/src/private_models
      - key: AGRISENSE_TEMPORAL_CSV
        value: /opt/render/project/src/data/karnal_real_temporal_table.csv

  - type: web
    name: agrisense-web
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: AGRISENSE_AUTO_START_INFERENCE
        value: "0"
      - key: AGRISENSE_INFERENCE_HOST
        fromService:
          type: web
          name: agrisense-inference
          property: host
      - key: AGRISENSE_INFERENCE_PORT
        fromService:
          type: web
          name: agrisense-inference
          property: port